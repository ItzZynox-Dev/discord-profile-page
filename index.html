<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d;
    --bg-glow-a: rgba(239,68,68,0.14);
    --bg-glow-b: rgba(88,101,242,0.12);
    --card:#101219;
    --card-2:#0d0e14;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #f2f3f7;
    --text-dim: #8b8f9c;
    --text-faint: #565a66;
    --accent-red: #ef4444;
    --accent-blurple: #5865F2;
    --status-online: #23a55a;
    --status-idle: #f0b232;
    --status-dnd: #f23f43;
    --status-offline: #80848e;
    --status-color: var(--status-offline);
    --status-glow: rgba(128,132,142,0.5);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100%;
  }

  body{
    background:
      radial-gradient(700px 420px at 8% 0%, var(--bg-glow-a), transparent 60%),
      radial-gradient(700px 420px at 92% 6%, var(--bg-glow-b), transparent 60%),
      var(--bg);
    padding: 48px 20px 80px;
    display:flex;
    justify-content:center;
  }

  .page{ width:100%; max-width:1180px; }

  /* ---------- eyebrow ---------- */
  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:4px; font-weight:600;
    color: var(--text-dim);
    margin-bottom: 22px;
    text-transform:uppercase;
  }
  .eyebrow .dot{ width:4px; height:4px; border-radius:50%; background:var(--accent-red); }

  /* ---------- hero card ---------- */
  .hero{
    position:relative;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border:1px solid var(--border);
    border-radius:22px;
    padding:44px;
    display:grid;
    grid-template-columns: auto 1fr auto;
    gap:44px;
    align-items:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(120deg, black, transparent 45%);
            mask-image: linear-gradient(120deg, black, transparent 45%);
    pointer-events:none;
  }

  .avatar-wrap{ position:relative; width:190px; height:190px; flex-shrink:0; }
  .avatar-ring{
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, var(--status-color), transparent 30%, var(--status-color) 70%, transparent 100%);
    filter: blur(0.3px);
    animation: spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .avatar-inner{
    position:absolute; inset:6px; border-radius:50%;
    background: #05060a;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
  }
  .avatar-inner img{
    width:100%; height:100%; object-fit:cover;
    opacity:0; transition: opacity .5s ease;
  }
  .avatar-inner img.loaded{ opacity:1; }
  .avatar-fallback{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:46px; letter-spacing:1px;
    color: var(--text-faint);
  }
  .status-dot{
    position:absolute; right:6px; bottom:8px;
    width:34px; height:34px; border-radius:50%;
    background: var(--status-color);
    border:5px solid var(--card);
    box-shadow: 0 0 18px 2px var(--status-glow);
    transition: background .4s ease, box-shadow .4s ease;
    z-index:4;
  }
  .avatar-decoration{
    position:absolute;
    inset:-15px;
    width:calc(100% + 30px);
    height:calc(100% + 30px);
    pointer-events:none;
    opacity:0;
    transition: opacity .4s ease;
    z-index:6;
  }
  .avatar-decoration.loaded{ opacity:1; }

  .identity{ min-width:0; }
  .discord-tag{
    display:flex; align-items:center; gap:9px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600; letter-spacing:2.5px;
    color: var(--accent-blurple);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .discord-tag svg{ width:18px; height:18px; }
  .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 4vw, 52px);
    line-height:1.05;
    letter-spacing:-0.5px;
    margin-bottom:8px;
    word-break: break-word;
  }
  .handle{
    font-size:16px; color: var(--text-dim); margin-bottom:14px;
  }
  .badges-row{
    display:flex; align-items:center; gap:7px;
    margin-bottom:14px;
    flex-wrap:wrap;
    min-height:22px;
  }
  .badge-icon{
    width:22px; height:22px;
    border-radius:4px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
    transition: transform .15s ease;
  }
  .badge-icon:hover{ transform: translateY(-2px) scale(1.12); }
  .status-line{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; font-weight:600; color: var(--status-color);
    background: rgba(255,255,255,0.03);
    border:1px solid var(--border);
    padding:6px 12px 6px 10px;
    border-radius:999px;
    transition: color .4s ease;
  }
  .status-line .pip{
    width:8px; height:8px; border-radius:50%;
    background: var(--status-color);
    box-shadow: 0 0 8px 1px var(--status-glow);
  }
  .activity-line{
    margin-top:10px; font-size:13px; color: var(--text-dim);
    max-width: 420px;
  }
  .activity-line b{ color: var(--text); font-weight:600; }

  .about{
    border-left:1px solid var(--border);
    padding-left:40px;
    max-width:260px;
  }
  .about .label{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:2.5px; font-weight:600;
    color: var(--accent-blurple); text-transform:uppercase; margin-bottom:12px;
  }
  .about p{ font-size:14px; line-height:1.7; color: var(--text-dim); }

  @media (max-width: 880px){
    .hero{ grid-template-columns:1fr; text-align:center; padding:32px 24px; }
    .avatar-wrap{ margin:0 auto; }
    .discord-tag, .status-line, .activity-line{ justify-content:center; margin-left:auto; margin-right:auto; }
    .about{ border-left:none; border-top:1px solid var(--border); padding-left:0; padding-top:24px; max-width:100%; }
  }

  /* ---------- section divider ---------- */
  .divider{
    display:flex; align-items:center; gap:18px;
    margin: 46px 0 26px;
  }
  .divider span{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:4px; font-weight:600;
    color: var(--text-dim); white-space:nowrap; text-transform:uppercase;
  }
  .divider .line{ flex:1; height:1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); }

  /* ---------- socials grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap:14px;
  }
  .social-card{
    background: var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-decoration:none;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .social-card:hover{ transform: translateY(-3px); border-color: var(--border-strong); background:#14161f; }
  .social-icon{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.04);
  }
  .social-icon svg{ width:24px; height:24px; }
  .social-name{ font-size:12.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }
  .social-value{ font-size:11.5px; color: var(--text-faint); }
  .social-bar{ width:26px; height:2px; border-radius:2px; margin-top:2px; }

  /* ---------- dev section ---------- */
  .dev-panel{
    background: var(--card-2);
    border:1px solid rgba(35,165,90,0.22);
    border-radius:20px;
    padding:36px;
  }
  .dev-title{
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:14px; letter-spacing:3px;
    color:#23a55a; text-transform:uppercase; margin-bottom:30px;
  }
  .stack-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap:6px;
  }
  .stack-item{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding: 10px 8px;
    border-left: 1px solid var(--border);
  }
  .stack-item:first-child{ border-left:none; }
  .stack-icon{ width:52px; height:52px; }
  .stack-name{ font-size:11.5px; font-weight:700; letter-spacing:1px; color: var(--text-dim); text-transform:uppercase; }

  @media (max-width: 700px){
    .stack-item{ border-left:none; border-top:1px solid var(--border); }
  }

  footer{
    text-align:center; margin-top:40px;
    font-size:11.5px; color: var(--text-faint);
    font-family:'JetBrains Mono', monospace;
    letter-spacing:1px;
    line-height:1.9;
  }
  footer a{ color: var(--text-dim); }
  .credit a{ color: var(--accent-blurple); font-weight:600; text-decoration:none; }
  .credit a:hover{ text-decoration:underline; }
</style>
</head>

// ====== BADGES DISCORD DOESN'T EXPOSE VIA public_flags ======
// Nitro, Server Booster, and Orbs/Quests badges are NOT part of the
// public_flags bitfield — Discord stores them separately (premium_type,
// guild boost data, the Quests/Orbs system) and Lanyard's public API
// does not return that data at all. So they can never be detected live.
// If you have any of these, list them here manually and they'll always show.
//
// How to find the hash for a badge you own:
//  1) Open Discord in your browser, open your own profile popup.
//  2) Open DevTools (F12) -> Network tab -> filter "badge-icons".
//  3) Hover/click your profile again, look for a request like
//     https://cdn.discordapp.com/badge-icons/<HASH>.png
//  4) Copy that <HASH> into the list below.
const STATIC_BADGES = [
  // { label: "Discord Nitro",   hash: "PUT_YOUR_NITRO_HASH_HERE" },
  // { label: "Server Booster",  hash: "PUT_YOUR_BOOST_HASH_HERE" },
  // { label: "Orb/Quest Badge", hash: "PUT_YOUR_ORB_HASH_HERE" },
];

function renderBadges(publicFlags){
  const wrap = document.getElementById("badgesRow");
  wrap.innerHTML = "";

  const addBadge = (label, hash) => {
    const img = document.createElement("img");
    img.className = "badge-icon";
    img.src = `https://cdn.discordapp.com/badge-icons/${hash}.png`;
    img.alt = label;
    img.title = label;
    img.loading = "lazy";
    wrap.appendChild(img);
  };

  // 1) Static badges that Discord's API can't tell us about (Nitro, Boost, Orbs...)
  STATIC_BADGES.forEach(b => addBadge(b.label, b.hash));

  // 2) Dynamic badges from the public_flags bitfield (Staff, HypeSquad, Bug Hunter, etc.)
  if(typeof publicFlags !== "number") return;
  BADGE_FLAGS.forEach(b=>{
    if((publicFlags & b.bit) === b.bit){
      addBadge(b.label, b.hash);
    }
  });
}

/* ====== AVATAR DECORATION ====== */
function setAvatarDecoration(discordUser){
  const el = document.getElementById("avatarDecoration");
  const deco = discordUser && discordUser.avatar_decoration_data;
  const asset = deco && deco.asset;
  if(!asset){
    el.classList.remove("loaded");
    el.removeAttribute("src");
    return;
  }
  el.onload = () => el.classList.add("loaded");
  el.onerror = () => el.classList.remove("loaded");
  el.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png`;
}

/* ====== LIVE DISCORD STATUS via Lanyard ====== */
const STATUS_META = {
  online:  { color:"var(--status-online)",  glow:"rgba(35,165,90,0.55)",  label:"Online"  },
  idle:    { color:"var(--status-idle)",    glow:"rgba(240,178,50,0.55)", label:"Idle"    },
  dnd:     { color:"var(--status-dnd)",     glow:"rgba(242,63,67,0.55)",  label:"Do Not Disturb" },
  offline: { color:"var(--status-offline)", glow:"rgba(128,132,142,0.55)",label:"Offline" },
};

function applyStatus(status){
  const meta = STATUS_META[status] || STATUS_META.offline;
  document.documentElement.style.setProperty("--status-color", meta.color);
  document.documentElement.style.setProperty("--status-glow", meta.glow);
  document.getElementById("statusText").textContent = meta.label;
}

async function loadDiscord(){
  if(locked) return;
  if(!creditOk()){ lockPage(); return; }
  if(!/^\d{15,25}$/.test(DISCORD_ID)){
    applyStatus("offline");
    document.getElementById("statusText").textContent = "Set DISCORD_ID in index.html";
    return;
  }
  try{
    const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    const json = await res.json();
    if(!json.success) throw new Error("lanyard error");
    const d = json.data;
    const u = d.discord_user;

    document.getElementById("displayName").textContent = u.global_name || u.username;
    document.getElementById("username").textContent = "@" + u.username;

    setDiscordAvatar(u);

    renderBadges(u.public_flags);
    setAvatarDecoration(u);

    applyStatus(d.discord_status);

    const activity = (d.activities || []).find(a => a.type !== 4) // skip custom status text-only for the "playing" line
      || (d.activities || [])[0];

    const activityLine = document.getElementById("activityLine");
    activityLine.textContent = "";
    const addLine = (prefix, strong, suffix) => {
      if(prefix) activityLine.append(prefix);
      if(strong){ const b = document.createElement("b"); b.textContent = strong; activityLine.append(b); }
      if(suffix) activityLine.append(suffix);
    };
    if(d.listening_to_spotify && d.spotify){
      addLine("🎧 Listening to ", d.spotify.song, " — " + d.spotify.artist);
    } else if(activity){
      if(activity.type === 4) addLine("", activity.state || activity.name || "", "");
      else addLine((activity.type === 0 ? "Playing" : "Active in") + " ", activity.name, "");
    }
  }catch(e){
    document.getElementById("statusText").textContent = "Error: " + e.message;
    applyStatus("offline");
    document.getElementById("activityLine").textContent = "Check the browser console (F12) for details.";
    console.error(e);
  }
}

/* ====== LIVE AVATAR (auto-set from Discord) ====== */
function setDiscordAvatar(discordUser){
  const img = document.getElementById("avatarImg");
  const fallback = document.getElementById("avatarFallback");

  let url;
  if(discordUser && discordUser.avatar){
    // animated avatars (Nitro) have hashes starting with "a_" -> serve as gif
    const ext = discordUser.avatar.startsWith("a_") ? "gif" : "png";
    url = `https://cdn.discordapp.com/avatars/${discordUser.id}/${discordUser.avatar}.${ext}?size=256`;
  } else if(discordUser && discordUser.id){
    // user has no custom avatar -> Discord's default avatar for their id
    const defaultIndex = (BigInt(discordUser.id) >> 22n) % 6n;
    url = `https://cdn.discordapp.com/embed/avatars/${defaultIndex}.png`;
  } else {
    // Lanyard hasn't returned anything usable — keep whatever fallback avatar we last had
    return;
  }

  img.onload = () => {
    img.classList.add("loaded");
    fallback.style.display = "none";
  };
  img.onerror = () => {
    img.classList.remove("loaded");
    fallback.style.display = "flex";
  };
  img.src = url;
}

/* ====== REQUIRED CREDIT (see LICENSE) ======
   The page shows "Created by ItzZynox" in the footer and verifies it.
   If the credit is removed, edited or hidden, the page stops working. */
const CREDIT = { name:"ItzZynox", url:"https://github.com/ItzZynox-Dev" };
const CREDIT_SIG = "fhcg8l";
let locked = false, guardTimer = null;

const _sig = str => { let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); };

function buildCredit(){
  let f = document.querySelector("footer");
  if(!f){ f = document.createElement("footer"); document.querySelector(".page").appendChild(f); }
  f.textContent = "";
  const wrap = document.createElement("div");
  wrap.className = "credit";
  wrap.append("Created by ");
  const a = document.createElement("a");
  a.href = CREDIT.url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = CREDIT.name;
  wrap.append(a);
  f.appendChild(wrap);
}

function creditOk(){
  if(_sig(CREDIT.name + "|" + CREDIT.url) !== CREDIT_SIG) return false;
  const a = document.querySelector("footer .credit a");
  if(!a || a.getAttribute("href") !== CREDIT.url || a.textContent !== CREDIT.name) return false;
  if(!a.parentElement || a.parentElement.textContent !== "Created by " + CREDIT.name) return false;
  const r = a.getBoundingClientRect();
  if(r.width < 8 || r.height < 8) return false;
  for(let e = a; e && e !== document.documentElement; e = e.parentElement){
    const c = getComputedStyle(e);
    if(c.display === "none" || c.visibility === "hidden" || parseFloat(c.opacity) < 0.5) return false;
    if(e === a && parseFloat(c.fontSize) < 9) return false;
  }
  return true;
}

function lockPage(){
  locked = true;
  clearInterval(guardTimer);
  document.body.textContent = "";
  const m = document.createElement("div");
  m.style.cssText = "max-width:460px;margin:20vh auto;text-align:center;line-height:1.8;color:#8b8f9c;font-size:14px";
  m.textContent = "This page requires the original credit to " + "ItzZynox" + " (github.com/ItzZynox-Dev). Restore the footer credit to use it.";
  document.body.appendChild(m);
}

buildCredit();
guardTimer = setInterval(() => { if(!locked && !creditOk()) lockPage(); }, 1500);

loadDiscord();
setInterval(loadDiscord, 20000); // refresh every 20s
